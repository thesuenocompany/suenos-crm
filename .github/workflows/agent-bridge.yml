name: Agent bridge checks
on:
  pull_request:
    paths: ['supabase/functions/suenos-agent-bridge/**', 'tests/agent-*.mjs', 'package*.json', '.github/workflows/agent-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:agent
